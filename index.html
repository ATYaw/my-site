  <title>１２０歳のお祝い</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>雑学まとめ</h1>
  </header>

  <main>
    <article>
      <h2>１２０歳のお祝い</h2>
      <time datetime="2026-10-26">
        2026-10-26
      </time>
      <p>日本の「長寿の祝い」は、６０歳の「還暦」「華甲」をはじめ、
        「古希」（７０歳）、「喜寿」（７７歳）、「傘寿」（８８歳）、
        「卒寿」（９０歳）、「白寿」（９９歳）、「百寿」「紀寿」（１００歳）
        と続くが、では、１００歳以上は何と言うのだろうか？
      </p>
      <p>実は、１０８歳は「茶寿」「不枠」、１１１歳は「皇寿」「川寿」といい、
        １２０歳は「大還暦」「昔寿」という。
      </p>
      <p>１２０歳は還暦の２倍だから「大還暦」と称するのだろうか、
        何ともおもしろい発想の言葉である。
      </p>
    </article>
  </main>
</body>
</html>
